name: Issue SLA Tracker

on:
  schedule:
    - cron: '15 2 * * *'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  track-sla:
    runs-on: ubuntu-latest
    steps:
      - name: Label and notify overdue issues
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const labelName = 'sla-breached';
            const cutoff = Date.now() - 24 * 60 * 60 * 1000;
            const openItems = await github.paginate(github.rest.issues.listForRepo, {
              owner,
              repo,
              state: 'open',
              per_page: 100
            });

            let labelChecked = false;
            for (const issue of openItems) {
              if (issue.pull_request || Date.parse(issue.created_at) > cutoff) continue;
              if (issue.labels.some(label => label.name === labelName)) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                owner,
                repo,
                issue_number: issue.number,
                per_page: 100
              });
              const hasHumanComment = comments.some(comment =>
                comment.user?.type !== 'Bot' && comment.user?.login !== 'github-actions[bot]'
              );
              if (hasHumanComment) continue;

              if (!labelChecked) {
                try {
                  await github.rest.issues.getLabel({ owner, repo, name: labelName });
                } catch (error) {
                  if (error.status !== 404) throw error;
                  try {
                    await github.rest.issues.createLabel({
                      owner,
                      repo,
                      name: labelName,
                      color: 'B60205',
                      description: 'Open issue has had no human comment for over 24 hours (UTC).'
                    });
                  } catch (createError) {
                    if (createError.status !== 422) throw createError;
                  }
                }
                labelChecked = true;
              }

              await github.rest.issues.addLabels({
                owner,
                repo,
                issue_number: issue.number,
                labels: [labelName]
              });
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issue.number,
                body: '이 이슈는 UTC 기준 생성 후 24시간 동안 사람의 댓글이 없어 `sla-breached`로 표시했습니다. 담당자가 확인 후 진행 상황을 남겨 주세요.'
              });
              core.info(`Marked issue #${issue.number} as ${labelName}.`);
            }